<!doctype html>

<head>
<meta charset="utf-8">
<script>
/* Theme before first paint: read the stored choice (light / dark /
   system, default system), and set data-theme on <html> so Bulma
   and bulma-theme.css paint the right theme immediately, with no
   light flash on a dark phone. System means: follow matchMedia,
   and the main script below listens for system changes. */
(function () {
  try {
    var choice = localStorage.getItem('ai-auto-pages-theme') || 'system';
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var effective = choice === 'dark' ? 'dark' : choice === 'light' ? 'light' : (dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', effective);
    document.documentElement.setAttribute('data-theme-choice', choice);
  } catch (e) {}
})();
</script>
<script>
/* Start loading the site data right now, in parallel with the two
   stylesheets below (bulma.min.css is ~678 KB, the JSON is ~11 KB,
   so the data is normally ready before the first styled paint and
   the page never shows its empty skeleton). The main script at the
   bottom reuses this promise instead of starting a second fetch.
   The timestamp query stays, so edits saved via the edit page are
   still visible immediately, with no cache staleness. */
window.__siteData = fetch('data/site.json?' + Date.now()).then(function (res) {
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
});
window.__siteData.catch(function () {});
/* Safety net for the reveal gate in bulma-theme.css: whatever
   happens below, the page is shown within 3 seconds. */
setTimeout(function () { document.documentElement.classList.add('ready'); }, 3000);
</script>

<body>
<section class="section site-section">
<div class="container is-max-tablet site-container">
<div class="theme-switch">
  <div class="theme-switch-group" role="group" aria-label="切换主题" data-active="system">
    <span class="theme-switch-thumb" aria-hidden="true"></span>
    <button type="button" data-theme-choice="light" title="浅色" aria-label="浅色主题">☀</button>
    <button type="button" data-theme-choice="dark" title="深色" aria-label="深色主题">🌙</button>
    <button type="button" data-theme-choice="system" title="跟随系统" aria-label="跟随系统主题">🖥️</button>
  </div>
</div>
  <h1 id="siteTitle" class="title has-text-centered">妖者发电站</h1>

  <div class="card mb-4" id="noticeSection">
    <header class="card-header"><p class="card-header-title">说明</p></header>
    <div class="card-content">
      <div class="content" id="noticeBody"></div>
    </div>
  </div>

  <div class="card mb-4">
    <header class="card-header"><p class="card-header-title">选择项目</p></header>
    <div class="card-content">
      <p class="pick-hint">请先选择项目，查看下载信息和购买按钮</p>
      <div id="projectGrid" class="pick-grid"><p class="pick-status">数据加载中……</p></div>
    </div>
  </div>

  <div class="card mb-4" id="faqSection">
    <header class="card-header"><p class="card-header-title">常见问题</p></header>
    <div class="card-content">
      <div id="faqList"></div>
    </div>
  </div>

  <footer class="footer has-text-centered is-size-7 pt-4 pb-2">本页面由粉丝支持赞助，与其他任何平台以及平台用户无关。</footer>
</div>
</section>

<script>
const grid = document.getElementById('projectGrid');
const DEFAULT_BUTTON_TEXT = '购买(需要翻墙)';
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let products = [];
let current = -1;

/* The panel for the chosen project (tips + its buttons). It is placed
   inside the grid, right after the last tile of the chosen tile's row,
   spanning the full width, so it opens directly under the tile. */
const panel = document.createElement('div');
panel.className = 'pick-panel';
panel.id = 'pickPanel';
const detail = document.createElement('div');
detail.className = 'detail';
const actions = document.createElement('div');
actions.className = 'pick-actions';
panel.appendChild(detail);
panel.appendChild(actions);
panel.addEventListener('animationend', () => panel.classList.remove('is-entering'));

/* Buttons for one project: its own "buttons" list when it has one;
   otherwise (projects not yet re-configured) one default button to
   the project's "url", exactly like before. */
function buttonsFor(p){
  const list = Array.isArray(p.buttons) ? p.buttons.filter(b => b && b.url) : [];
  if (list.length) return list.map(b => ({ text: b.text || DEFAULT_BUTTON_TEXT, url: b.url }));
  return p.url ? [{ text: DEFAULT_BUTTON_TEXT, url: p.url }] : [];
}
function tiles(){ return Array.from(grid.querySelectorAll('.pick-tile')); }
function placePanel(){
  if (current < 0) { panel.remove(); return; }
  /* Measure rows without the panel in the way, then put it back
     only if its place changed (re-inserting would replay the
     opening animation on every resize). */
  const before = panel.previousElementSibling;
  panel.style.position = 'absolute'; /* out of the grid flow, without display:none (that would replay its animations) */
  const ts = tiles();
  const top = ts[current].offsetTop;
  let last = ts[current];
  for (let j = current + 1; j < ts.length && ts[j].offsetTop === top; j++) last = ts[j];
  panel.style.position = '';
  if (!panel.parentNode || before !== last) last.after(panel);
}
function choose(idx){
  current = idx === current ? -1 : idx;
  tiles().forEach((t, i) => {
    const on = i === current;
    t.classList.toggle('is-selected', on);
    t.setAttribute('aria-expanded', on ? 'true' : 'false');
  });
  if (current < 0) { placePanel(); return; }
  const p = products[current];
  if (p.tips) { detail.innerHTML = '<div>' + p.tips + '</div>'; detail.classList.add('show'); }
  else { detail.innerHTML = ''; detail.classList.remove('show'); }
  actions.innerHTML = '';
  buttonsFor(p).forEach(cfg => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'button is-primary is-fullwidth is-medium';
    b.textContent = cfg.text;
    b.addEventListener('click', () => { window.open(cfg.url, '_blank'); });
    actions.appendChild(b);
  });
  placePanel();
  panel.classList.remove('is-entering'); void panel.offsetWidth; panel.classList.add('is-entering');
  requestAnimationFrame(() => {
    const r = panel.getBoundingClientRect();
    if (r.bottom > window.innerHeight || r.top < 0) {
      panel.scrollIntoView({ block: r.height > window.innerHeight * 0.8 ? 'start' : 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
    }
  });
}
let resizeFrame = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(placePanel); });

async function load(){
  try {
    const data = await (window.__siteData || fetch('data/site.json?' + Date.now()).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }));
    if (data.title) { document.getElementById('siteTitle').textContent = data.title; document.title = data.title; }
    const notice = typeof data.notice === 'string' ? data.notice.trim() : '';
    document.getElementById('noticeBody').innerHTML = notice;
    document.getElementById('noticeSection').style.display = notice ? '' : 'none';
    products = data.products || [];
    grid.innerHTML = '';
    if (!products.length) grid.innerHTML = '<p class="pick-status">暂无项目</p>';
    products.forEach((p, i) => {
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'pick-tile';
      t.textContent = p.name || '';
      if ((p.name || '').length > 12) t.classList.add('is-wide');
      t.setAttribute('aria-expanded', 'false');
      t.setAttribute('aria-controls', 'pickPanel');
      t.addEventListener('click', () => choose(i));
      grid.appendChild(t);
    });
    const faqs = data.faqs || [];
    const faqList = document.getElementById('faqList');
    const faqSection = document.getElementById('faqSection');
    if (!faqs.length) { faqSection.style.display = 'none'; }
    else {
      faqSection.style.display = '';
      faqList.innerHTML = '';
      faqs.forEach(f => {
        const question = f['问题'] || f.question || '';
        const answer = f['回答'] || f.answer || '';
        if (!question && !answer) return;
        const d = document.createElement('details');
        const s = document.createElement('summary');
        s.textContent = question;
        const a = document.createElement('div');
        a.innerHTML = answer;
        d.appendChild(s); d.appendChild(a); faqList.appendChild(d);
      });
    }
  } catch (e) {
    document.getElementById('noticeSection').style.display = 'none';
    grid.innerHTML = '<p class="pick-status">数据加载失败，请刷新重试</p>';
  } finally {
    /* Data is in (or has failed): show the finished page in one
       paint, with the space-between layout already settled. */
    document.documentElement.classList.add('ready');
  }
}
load();
</script>
<script>
/* Theme switch: a quiet three-symbol segmented group. Choice
   is stored (light / dark / system) and shared by both pages via
   localStorage. System does not mean a CSS media query: it means
   this script sets data-theme from matchMedia and updates it when
   the system theme changes, so manual Light always wins over a
   dark phone, and manual Dark always wins over a light phone.
   The head script already set the first paint. The sliding pill
   behind the active symbol moves by CSS transition on the
   group's data-active attribute; the group only gets the ready
   class after the first apply, so the pill does not slide on
   page load. */
(function () {
  var KEY = 'ai-auto-pages-theme';
  var root = document.querySelector('.theme-switch');
  if (!root) return;
  var group = root.querySelector('.theme-switch-group');
  var items = group.querySelectorAll('button');
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effective(choice) {
    if (choice === 'dark') return 'dark';
    if (choice === 'light') return 'light';
    return media && media.matches ? 'dark' : 'light';
  }
  function apply(choice) {
    try { localStorage.setItem(KEY, choice); } catch (e) {}
    document.documentElement.setAttribute('data-theme', effective(choice));
    document.documentElement.setAttribute('data-theme-choice', choice);
    group.setAttribute('data-active', choice);
    items.forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-theme-choice') === choice);
    });
  }
  items.forEach(function (b) {
    b.addEventListener('click', function () { apply(b.getAttribute('data-theme-choice')); });
  });
  if (media && media.addEventListener) {
    media.addEventListener('change', function () {
      var choice = document.documentElement.getAttribute('data-theme-choice') || 'system';
      if (choice === 'system') apply('system');
    });
  }
  try { apply(localStorage.getItem(KEY) || 'system'); } catch (e) { apply('system'); }
  group.classList.add('ready');
})();
</script>
</body>
